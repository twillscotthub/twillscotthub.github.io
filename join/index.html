<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join on Nightcap</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#0e100e; color:#ece7dd; text-align:center; padding:1.5rem;
         font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  h1 { font-size:2rem; margin:0 0 .5rem; font-weight:500; }
  p { color:#a9a399; margin:0 0 1.25rem; }
  .code { font:600 2rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
          letter-spacing:.35em; color:#d9a95c; margin:0 0 .35rem; padding-left:.35em; }
  .hint { font-size:.9rem; color:#76736c; }
  a.btn { display:inline-block; background:#d9a95c; color:#0e100e; font-weight:600;
          text-decoration:none; padding:.85rem 1.6rem; border-radius:999px; }
</style></head>
<body><main>
  <h1>Your partner is waiting</h1>
  <p>Open this on the iPhone you will use Nightcap on.</p>
  <p class="code" id="code">······</p>
  <p class="hint" id="hint">Enter this code in Nightcap after installing.</p>
  <p><a class="btn" href="https://apps.apple.com/app/id6819069052">Get Nightcap</a></p>
<script>
  // Shown only when the app is not installed: a universal link is intercepted
  // by iOS before this page is ever requested.
  var code = new URLSearchParams(location.search).get('c');
  if (code) { document.getElementById('code').textContent = code.toUpperCase(); }
  else { document.getElementById('code').style.display = 'none';
         document.getElementById('hint').textContent = 'Ask your partner for their code.'; }
</script>
</main></body></html>
